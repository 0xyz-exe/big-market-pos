services:
  postgres:
    image: postgres:17-alpine
    container_name: big-market-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - big-market-pos-pgdata-v1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  big-market-pos-pgdata-v1:
    name: big-market-pos-pgdata-v1
